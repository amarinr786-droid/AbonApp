name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check-secrets:
    name: Comprobar secretos de AWS
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Verificar AWS_ACCESS_KEY_ID
        id: check
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$AWS_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Configura los secretos AWS_* y EC2_* para habilitar el despliegue."
          fi

  deploy-frontend:
    name: Frontend · S3 + CloudFront
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: abonapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: abonapp/package-lock.json

      - name: Instalar y compilar
        run: npm ci && npm run build
        env:
          # CloudFront sirve frontend y API bajo el mismo dominio.
          NEXT_PUBLIC_API_URL: /api

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sincronizar out/ con S3
        run: aws s3 sync out/ "s3://${{ secrets.S3_BUCKET }}" --delete

      - name: Invalidar caché de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  deploy-backend:
    name: Backend · EC2 + PM2
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Actualizar y recargar en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.EC2_APP_DIR }}"
            git pull origin main
            cd backend
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
            curl -fsS http://127.0.0.1:3000/api/health
