name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check-secrets:
    name: Comprobar secretos de EC2
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Verificar EC2_HOST
        id: check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -n "$EC2_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Configura EC2_HOST, EC2_USER, EC2_SSH_KEY, EC2_APP_DIR y WEB_ROOT para habilitar el despliegue."
          fi

  deploy-frontend:
    name: Frontend · build + Apache
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abonapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: abonapp/package-lock.json

      - name: Instalar y compilar
        run: npm ci && npm run build
        env:
          # Apache sirve frontend y API bajo el mismo dominio.
          NEXT_PUBLIC_API_URL: /api

      - name: Copiar out/ a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "abonapp/out/**"
          target: "/tmp/abonapp-out-${{ github.run_id }}"
          strip_components: 2
          overwrite: true

      - name: Publicar en Apache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            sudo rsync -a --delete /tmp/abonapp-out-${{ github.run_id }}/ "${{ secrets.WEB_ROOT }}/"
            sudo chown -R www-data:www-data "${{ secrets.WEB_ROOT }}"
            rm -rf /tmp/abonapp-out-${{ github.run_id }}
            sudo systemctl reload apache2
            curl -fsS http://127.0.0.1/api/health

  deploy-backend:
    name: Backend · EC2 + PM2
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar y recargar en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.EC2_APP_DIR }}"
            git pull origin main
            cd backend
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
            curl -fsS http://127.0.0.1:3000/api/health
