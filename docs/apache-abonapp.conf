# /etc/apache2/sites-available/000-default.conf
# Frontend estático de Next.js en /var/www/html y API Express en /api.
<VirtualHost *:80>
    ServerName abonapp.tech
    ServerAlias www.abonapp.tech

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    DirectoryIndex index.html

    # Mismo origen: el navegador envía la cookie de sesión a /api.
    # En el VirtualHost *:443 (creado por Certbot) además debe ir:
    #   RequestHeader set X-Forwarded-Proto "https"
    # Sin esa cabecera express-session no envía la cookie Secure.
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    ErrorDocument 404 /404.html
</VirtualHost>
